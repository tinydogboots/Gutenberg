<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gutenberg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;700&family=JetBrains+Mono:wght@400;500&family=EB+Garamond:wght@400;600&family=Playfair+Display:wght@400;700&family=DM+Serif+Display&family=Cormorant+Garamond:wght@500;700&family=Libre+Baskerville:wght@400;700&family=Space+Grotesk:wght@400;700&family=Archivo+Black&family=Bebas+Neue&display=swap">
<style>
  /* Same language as Screw Around: light paper control panel on the left, the stage on the right.
     Light grotesk set huge and tight for display, small grotesk for labels, monospace for values. */
  :root{
    color-scheme: light;
    --paper:#f9f8f5; --ink:#333333; --ink-strong:#101010; --well:#efeee9; --muted:#8b887f; --rule:rgba(51,51,51,.85);
    --stage:#f2f2f2; --stage-ink:#111111; --stage-muted:rgba(17,17,17,.58);
    --mono:"JetBrains Mono", SFMono-Regular, Consolas, Menlo, monospace;
    --grot:"Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:12.5px/1.15 var(--mono);text-transform:uppercase;letter-spacing:.02em}
  button,select,input,option,textarea{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
  button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
  :focus-visible{outline:1px dotted var(--ink-strong);outline-offset:2px}

  #app{display:grid;grid-template-columns:316px minmax(0,1fr);height:100%}

  /* ---- control panel ---- */
  #panel{display:flex;flex-direction:column;min-height:0;border-right:1px dotted var(--rule);padding-left:env(safe-area-inset-left, 0px)}
  #controls{flex:1;overflow-y:auto;padding:6px 0 18px}
  .brand{padding:14px 10px 12px;border-bottom:1px dotted var(--rule);font-family:var(--grot)}
  .brand-big{display:block;font-weight:300;font-size:52px;line-height:.86;letter-spacing:-.055em;margin-left:-3px}
  .brand-sub{display:block;margin-top:10px;font:10.5px var(--grot);letter-spacing:.03em;color:var(--muted)}
  .grp{margin-top:16px}
  .grp h3{display:flex;align-items:baseline;gap:6px;margin:0;font:300 21px/1 var(--grot);letter-spacing:-.035em;padding:0 8px;position:relative}
  .grp h3::after{content:"";flex:1;border-top:1px dotted var(--rule);order:1;margin:0 2px;align-self:center}
  .grp h3 span{background:var(--paper);order:0}
  .grp h3 .fold{order:3;width:14px;text-align:center;font:12px var(--mono);letter-spacing:0}
  .grp h3 .reset{order:2;width:16px;text-align:center;font:13px var(--mono);letter-spacing:0;color:var(--muted)}
  .grp h3 .reset:hover{color:var(--ink-strong)}
  .row label,.check,.frow > span:first-child,.exportbtn > span,.lab{font-family:var(--grot);font-size:11.5px;letter-spacing:.02em}
  .grp-body{background:var(--well);padding:2px 8px 8px;margin-top:6px}
  .grp.closed .grp-body{display:none}
  .row{padding-top:10px}
  .row .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .row label{flex:none}
  .num{display:inline-flex;align-items:baseline;gap:3px;min-width:0}
  .num input{width:7ch;background:none;border:0;padding:0;text-align:right;border-bottom:1px solid transparent}
  .num input:focus{outline:none;border-bottom:1px dotted var(--ink)}
  .unit{color:var(--muted);font-size:11px}
  select{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0 0 1px;text-align:right;text-align-last:right;
    cursor:pointer;min-width:0;max-width:70%;text-overflow:ellipsis;text-decoration:underline dotted;text-underline-offset:3px}
  input[type=color]{-webkit-appearance:none;appearance:none;width:16px;height:16px;border:1px solid var(--ink);padding:0;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0}
  input[type=color]::-moz-color-swatch{border:0}
  .txt,.area{display:block;width:100%;margin-top:4px;background:var(--paper);border:1px dotted var(--rule);padding:5px 6px 4px;
    text-transform:none;font:12.5px/1.3 var(--grot);letter-spacing:0}
  .area{min-height:70px;resize:vertical}
  .txt:focus,.area:focus{outline:none;border-style:solid}
  .check{display:block;width:100%;padding:0}
  .check:hover{color:var(--ink-strong)}
  .filebox{display:flex;gap:6px;align-items:center;max-width:66%;min-width:0}
  .filebtn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px var(--mono);text-transform:none;
    border:1px dotted var(--ink);border-radius:999px;padding:4px 10px 3px}
  .filebtn:hover{background:var(--ink);color:var(--paper);border-style:solid}
  .clear{font:13px var(--mono);color:var(--muted)}
  .clear:hover{color:var(--ink-strong)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btns button,.tools button{border:1px dotted var(--ink);border-radius:999px;padding:5px 11px 4px;font:11px var(--grot);letter-spacing:.02em}
  .btns button:hover,.tools button:hover{background:var(--ink);color:var(--paper);border-style:solid}
  .readout{font:11px var(--mono);color:var(--muted);padding-top:8px;line-height:1.45}

  input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:2px 0 0;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(51,51,51,.45)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:10px;margin-top:-4.5px;background:var(--ink);border:0;border-radius:0}
  input[type=range]:hover::-webkit-slider-runnable-track,input[type=range]:focus::-webkit-slider-runnable-track{background:var(--ink)}
  input[type=range]::-moz-range-track{height:1px;background:rgba(51,51,51,.45)}
  input[type=range]::-moz-range-thumb{width:1px;height:10px;background:var(--ink);border:0;border-radius:0}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{width:3px}

  .off{opacity:.35;pointer-events:none}

  footer{border-top:1px dotted var(--rule);padding:10px 8px calc(10px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:9px;background:var(--paper)}
  .frow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tools{gap:6px;justify-content:flex-start;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dotted var(--rule)}
  .fmt{display:flex;gap:12px}
  .fmt button{color:var(--muted)}
  .fmt button[aria-pressed="true"]{color:var(--ink-strong);text-decoration:underline;text-underline-offset:3px}
  .exportbtn{display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 10px;background:var(--ink);color:var(--paper)}
  .exportbtn:hover{background:var(--ink-strong)}
  kbd{font:10px var(--mono);border:1px solid rgba(249,248,245,.45);padding:2px 4px}
  #status{min-height:14px;font-size:11px;color:var(--muted)}

  /* ---- stage ---- */
  main{position:relative;min-width:0;min-height:0;background:var(--stage);color:var(--stage-ink);overflow:hidden}
  main canvas{display:block;width:100%;height:100%}
  #bitmap{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
  #label{position:absolute;left:22px;top:20px;pointer-events:none;max-width:calc(100% - 44px);font-family:var(--grot)}
  #label .kicker{display:block;font-weight:300;font-size:21px;line-height:1;letter-spacing:-.035em}
  #label .big{display:block;font-weight:300;font-size:52px;line-height:.86;letter-spacing:-.055em;margin:.1em 0 0 -.03em;white-space:nowrap}
  #label .fine{display:block;font-size:10.5px;line-height:1.35;letter-spacing:.02em;margin-top:14px;max-width:40ch;color:var(--stage-muted)}
  #hint{position:absolute;right:max(18px, env(safe-area-inset-right, 0px));bottom:16px;color:var(--stage-muted);font:10.5px var(--grot);letter-spacing:.03em;pointer-events:none}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--stage-muted)}

  .sundial{display:block;width:150px;height:150px;margin:8px auto 2px;cursor:grab;touch-action:none}
  .sundial:active{cursor:grabbing}
  .sundial .path{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3}
  .sundial .subject{fill:var(--paper);stroke:var(--ink);stroke-width:1}
  .sundial .ray{stroke:var(--ink);stroke-width:1;opacity:.35}
  .sundial .sun{fill:var(--ink);stroke:var(--paper);stroke-width:2}
  .sundial .tag{font:9px var(--mono);letter-spacing:.08em;fill:var(--muted);text-anchor:middle}

  @media (max-width:760px){
    #app{display:flex;flex-direction:column;height:auto}
    main{height:45vh;height:45svh;order:1;border-bottom:1px dotted var(--rule);position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
    #label{left:14px;top:12px}
    #label .big{font-size:30px}
    #label .fine{display:none}
    #panel{order:2;border:0;padding-right:env(safe-area-inset-right, 0px)}
    #controls{overflow:visible}
    #hint{display:none}
  }
</style>
<script>
  // If the 3D engine fails to start, say why on the loading screen instead of waiting forever.
  (function () {
    const show = msg => { const el = document.getElementById('loading'); if (el && !el.dataset.final) el.textContent = msg; };
    addEventListener('error', e => {
      const ours = (e.target && e.target.tagName === 'SCRIPT') || (e.filename && (e.filename.startsWith(location.origin) || e.filename.includes('cdn.jsdelivr.net')));
      if (ours) show('3D engine failed to start: ' + (e.message || 'a script could not load') + '. Reload the page to try again.');
    }, true);
    setTimeout(() => show('The 3D engine is taking too long to load. Check your connection and reload the page.'), 15000);
  })();
</script>

<div id="app">
  <aside id="panel" aria-label="Controls">
    <div id="controls">
      <header class="brand">
        <span class="brand-big">Guten</span>
        <span class="brand-big">berg</span>
        <span class="brand-sub">Book mockups, rendered</span>
      </header>
    </div>
    <footer>
      <div class="frow tools">
        <button type="button" id="fit">Fit view</button>
        <button type="button" id="random">Randomize</button>
        <button type="button" id="reset">Reset</button>
        <button type="button" id="saveDesign">Save design</button>
        <button type="button" id="openDesign">Open design</button>
        <input type="file" id="designFile" accept="application/json,.json" hidden>
      </div>
      <div class="frow"><span>Size</span><select id="exRes" aria-label="Export size"></select></div>
      <div class="frow"><span>Aspect</span><select id="exAspect" aria-label="Export aspect ratio"></select></div>
      <div class="frow"><span>Framing</span><select id="exFrame" aria-label="Export framing"><option value="fit">Fit book</option><option value="view">As on screen</option></select></div>
      <div class="frow"><span>Background</span>
        <span class="fmt"><button type="button" data-bg="transparent" aria-pressed="true">Transparent</button><button type="button" data-bg="colour" aria-pressed="false">Colour</button></span></div>
      <button type="button" class="exportbtn" id="export"><span>Export PNG</span><kbd>cmd + S</kbd></button>
      <div id="status" role="status"></div>
    </footer>
  </aside>
  <main>
    <div id="loading">Loading 3D engine…</div>
    <canvas id="bitmap" hidden></canvas>
    <div id="label"></div>
    <div id="hint">Drag orbit · right-drag pan · scroll zoom</div>
  </main>
</div>

        camera.near = Math.max(1, dist / 100); camera.far = dist * 50;
      } else if (camera.aspect < saved.aspect) {   // narrower: widen the lens so the sides still fit
        camera.fov = 2 * Math.atan(Math.tan(saved.fov * D2R / 2) * saved.aspect / camera.aspect) / D2R;
      }
      camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      const transparent = EX.bg === 'transparent';
      const out = mkCanvas(W, H);
      if (state.style === 'bitmap') { EXPORT = {canvas: out, w: W, h: H, scale: W / stageW, transparent}; renderFrame(true); }
      else {
        const cc = renderer.getClearColor(new THREE.Color()), ca = renderer.getClearAlpha();
        if (transparent) renderer.setClearColor(0x000000, 0);
        renderFrame(transparent);
        out.getContext('2d').drawImage(renderer.domElement, 0, 0);
        renderer.setClearColor(cc, ca);
      }
      out.toBlob(b => b ? offerFile(exportName('png'), b) : say('The image was too large for this browser. Try a smaller size.'), 'image/png');
    } catch (e) { say('Could not render: ' + e.message); }
    finally {
      EXPORT = null; texPPM = savedPPM; setShadowSize(2048);
      camera.position.copy(saved.pos); camera.quaternion.copy(saved.q); controls.target.copy(saved.target);
      camera.fov = saved.fov; camera.near = saved.near; camera.far = saved.far;
      resize(); applyLook(); controls.update(); bmDirty = true;
    }

}
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
document.querySelector('#export kbd').textContent = isMac ? 'cmd + S' : 'ctrl + S';
$('export').onclick = savePNG;
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); savePNG(); } });

// print template for the cover spread, matching how "One cover spread" artwork is placed
function saveTemplate() {
  const g = G, bl = state.artMode === 'wrap' ? state.bleed : 3, W = g.U + 2 * bl, H = g.Hc + 2 * bl, f = v => +v.toFixed(2);
  const x = v => f(v + bl), hinge = g.st + g.j;
  const lines = [], labels = [];
  const vline = (u, cls) => lines.push(`<line class="${cls}" x1="${x(u)}" y1="0" x2="${x(u)}" y2="${f(H)}"/>`);
  vline(g.Pw, 'fold'); vline(g.Pw + g.S, 'fold');
  if (g.hard) { vline(g.Pw - hinge, 'hinge'); vline(g.Pw + g.S + hinge, 'hinge'); }
  const lab = (u, y, t) => labels.push(`<text x="${x(u)}" y="${f(y)}">${t}</text>`);
  lab(g.Pw / 2, bl + g.Hc / 2, 'BACK'); lab(g.Pw + g.S + g.Pw / 2, bl + g.Hc / 2, 'FRONT');
  labels.push(`<text x="${x(g.Pw + g.S / 2)}" y="${f(bl + g.Hc / 2)}" transform="rotate(90 ${x(g.Pw + g.S / 2)} ${f(bl + g.Hc / 2)})">SPINE ${g.S.toFixed(1)} MM</text>`);
  lab(g.Pw / 2, bl + g.Hc / 2 + 8, `${g.Pw.toFixed(1)} × ${g.Hc.toFixed(1)} MM`);
  lab(g.Pw + g.S + g.Pw / 2, bl + g.Hc / 2 + 8, `${g.Pw.toFixed(1)} × ${g.Hc.toFixed(1)} MM`);
  const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${f(W)}mm" height="${f(H)}mm" viewBox="0 0 ${f(W)} ${f(H)}">
<style>.bleed{fill:#ffd9d9}.trim{fill:#ffffff;stroke:#e0245e;stroke-width:.25}.fold{stroke:#1d6fe0;stroke-width:.25;stroke-dasharray:2 1}
.hinge{stroke:#999;stroke-width:.2;stroke-dasharray:.6 .6}text{font:4px Helvetica,Arial,sans-serif;fill:#333;text-anchor:middle;letter-spacing:.2px}</style>
<rect class="bleed" width="${f(W)}" height="${f(H)}"/>
<rect class="trim" x="${f(bl)}" y="${f(bl)}" width="${f(g.U)}" height="${f(g.Hc)}"/>
${lines.join('\n')}
${labels.join('\n')}
<text x="${f(W / 2)}" y="${f(bl / 2 + 1.4)}" style="font-size:2.6px">COVER SPREAD ${g.U.toFixed(1)} × ${g.Hc.toFixed(1)} MM + ${bl} MM BLEED · ${state.pages} PP · ${g.hard ? 'HARDCOVER' : 'PAPERBACK'}</text>
</svg>`;
  offerFile(`gutenberg-cover-template-${Math.round(g.U)}x${Math.round(g.Hc)}.svg`, new Blob([svg], {type: 'image/svg+xml'}));
}

// designs: every setting plus the uploaded pictures in one JSON file
$('saveDesign').onclick = () => {
  const images = {}; for (const k in IMG) images[k] = {src: IMG[k].src, name: IMG[k].name};
  const name = (state.title || 'book').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'book';
  offerFile(`${name}.gutenberg.json`, new Blob([JSON.stringify({app: 'gutenberg', version: 1, state, images})], {type: 'application/json'}));
};
$('openDesign').onclick = () => $('designFile').click();
$('designFile').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t); if (!d || !d.state) throw new Error('not a Gutenberg design');
    Object.assign(state, DEFAULTS); loadState(d.state);
    for (const k of Object.keys(IMG)) delete IMG[k];
    const imgs = Object.entries(d.images || {});
    let left = imgs.length; const done = () => { if (--left <= 0) { saveImages(); loadFont(); schedule(); say('Opened ' + f.name); } };
    if (!left) { left = 1; done(); }
    for (const [k, v] of imgs) setImage(k, v.src, v.name, done);
  }).catch(err => say('Could not open: ' + err.message));
  e.target.value = '';
};

$('fit').onclick = fitView;
$('reset').onclick = () => { Object.assign(state, DEFAULTS); loadFont(); schedule(); };
const PALETTES = [['#1d3a57', '#efe4cc'], ['#7a1f24', '#f3e6c8'], ['#0f0f0f', '#f2f2f2'], ['#e8dcc4', '#1a1a1a'], ['#2f4a3a', '#e9d9a6'],
  ['#d9532b', '#fff6e8'], ['#f1c84b', '#1b1b1b'], ['#3b2d5b', '#f0c7a0'], ['#ffffff', '#c1272d'], ['#9bb7c9', '#14213d'], ['#b85c38', '#f5efe0']];
$('random').onclick = () => {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const t = pick(TRIMS.slice(1)), [bg, fg] = pick(PALETTES), hard = Math.random() < 0.55;
  Object.assign(state, {binding: hard ? 'hard' : 'paper', trim: t[0], width: t[2], height: t[3], pages: 2 * Math.round(40 + Math.random() * 300),
    frontColor: bg, spineColor: bg, backColor: bg, textColor: fg, font: pick(FONTS.slice(0, 9)), weight: pick(['400', '600', '700']),
    finish: pick(Object.keys(FINISHES)), foil: hard && Math.random() < 0.4 ? pick(['gold', 'silver', 'copper']) : 'ink',
    caps: Math.random() < 0.4, titlePos: Math.round(15 + Math.random() * 40), align: Math.random() < 0.75 ? 'center' : 'left',
    spine: Math.random() < 0.6 ? 'round' : 'square', edge: Math.random() < 0.2 ? pick(['sprayed', 'gilded']) : 'plain',
    edgeColor: pick(['#a3262a', '#1d3a57', '#d6a43b', '#0f0f0f', '#e06c3c']), headbandColor: pick(['#b8312f', '#efe4cc', '#1d3a57', '#c9a227']),
    ribbon: hard && Math.random() < 0.4, ribbonColor: pick(['#7a1f24', '#1d3a57', '#c9a227', '#2f4a3a'])});
  state.trim = t[0]; loadFont(); schedule();
};

/* ================= start ================= */
try {
  const saved = JSON.parse(localStorage.getItem(IMG_KEY) || 'null') || {};
  for (const [k, v] of Object.entries(saved)) if (v && v.src) setImage(k, v.src, v.name, schedule);
} catch {}
resize(); loadFont(); update(); setView('34');
if (document.fonts) document.fonts.ready.then(() => { fontsV++; schedule(); });
</script>
